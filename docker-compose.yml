# everybench: API + web UI, a worker, and Postgres.
#   docker compose up --build    then open http://127.0.0.1:8321
# Provider keys (OPENAI_API_KEY, ANTHROPIC_API_KEY, ...) are read from your shell or a .env file.
x-everybench: &everybench
  build: .
  image: everybench:local
  environment: &env
    EVERYBENCH_DATABASE_URL: postgresql+psycopg://everybench:everybench@db:5432/everybench
    EVERYBENCH_HOME: /data
    # Authentication and encrypted secrets. Create the first user with:
    #   docker compose run --rm api everybench admin create-user you@example.com --workspace main
    EVERYBENCH_AUTH: ${EVERYBENCH_AUTH:-1}
    EVERYBENCH_SECRET_KEY: ${EVERYBENCH_SECRET_KEY:?set EVERYBENCH_SECRET_KEY to a long random string}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    HF_TOKEN: ${HF_TOKEN:-}
  volumes:
    - everybench-data:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: everybench
      POSTGRES_PASSWORD: everybench
      POSTGRES_DB: everybench
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everybench"]
      interval: 2s
      retries: 30

  api:
    <<: *everybench
    command: ["everybench", "serve", "--host", "0.0.0.0", "--workers", "0"]
    ports:
      # Bound to localhost. Put TLS in front before exposing it beyond this machine.
      - "127.0.0.1:8321:8321"

  worker:
    <<: *everybench
    command: ["everybench", "worker", "--concurrency", "2"]
    # Sandboxed benchmarks (HumanEval, MBPP, Harbor agent benchmarks) start Docker containers.
    # Uncomment to let the worker use the host's Docker daemon; this grants it root-equivalent access.
    # volumes:
    #   - everybench-data:/data
    #   - /var/run/docker.sock:/var/run/docker.sock

volumes:
  everybench-data:
  postgres-data:

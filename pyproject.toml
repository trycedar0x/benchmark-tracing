[project]
name = "everybench"
version = "0.1.0"
description = "Evaluate user-owned agents, trace every task, and compare runs with paired statistics."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "inspect-ai>=0.3.277",
    "numpy>=2.5.3",
    "opentelemetry-exporter-otlp-proto-common>=1.45.1",
    "opentelemetry-proto>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=14.0.0",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.3",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
everybench = "everybench.cli:app"

[project.entry-points.inspect_ai]
everybench = "everybench._registry"

[project.optional-dependencies]
finance = [
    "anthropic>=1.17.0,<2",
    "openai>=3.4.0,<4",
]
eee = [
    "every-eval-ever[inspect]>=0.3.0",
]
postgres = [
    "psycopg[binary]>=3.3.6",
]

[project.urls]
Homepage = "https://evabench.dev/everybench"
Source = "https://github.com/trycedar0x/benchmark-tracing"
Issues = "https://github.com/trycedar0x/benchmark-tracing/issues"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: bt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra eee --extra postgres --extra finance
      - run: uv run ruff check src tests examples skills
      - name: Tests
        run: |
          unset EVERYBENCH_DATABASE_URL EVERYEVAL_DATABASE_URL BENCHTRACE_DATABASE_URL
          export EVERYBENCH_HOME=$RUNNER_TEMP/everybench-tests
          uv run pytest -q
        env:
          EVERYBENCH_TEST_POSTGRES: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:bt@localhost:5432/postgres' || '' }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: uv sync --frozen
      - run: npx --prefix web playwright install --with-deps chromium
      - name: Browser smoke tests
        run: |
          unset EVERYBENCH_DATABASE_URL EVERYEVAL_DATABASE_URL BENCHTRACE_DATABASE_URL
          export EVERYBENCH_HOME=$RUNNER_TEMP/bt
          uv run everybench serve --port 8321 &
          server=$!
          for i in $(seq 1 60); do curl -sf localhost:8321/api/health && break; sleep 1; done
          (cd web && npx playwright test --reporter=line); status=$?
          kill $server
          exit $status

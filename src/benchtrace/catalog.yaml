# Benchtrace benchmark catalog.
#
# Each entry pins one benchmark variant. `id@version` is the identity used for
# runs and comparisons; changing the task, its arguments, or the grader means a
# new version. `task_count` is the full evaluation set size for that variant.
#
# Offline entries (offline: true) ship with benchtrace and run with the
# `btmock/*` models without network access or API keys.

- id: toy-arith
  version: 1
  family: Toy arithmetic
  variant: 40 integer questions, exact numeric match
  adapter: inspect
  task: benchtrace/toy_arith
  grader: numeric exact match
  task_count: 40
  license: Apache-2.0
  offline: true
  requires: [chat]
  description: Bundled smoke-test benchmark. Pair with btmock/* models for offline demos.


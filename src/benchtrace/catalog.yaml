# Agent benchmarks run with Harbor (uv sync --extra harbor). Each task runs in a
# Docker sandbox. Model syntax: agent:model (e.g. terminus-2:openai/gpt-4o),
# a bare model for the default agent, or oracle / nop. Harbor resolves the
# dataset's latest version; each trial's task checksum is recorded and compared.

- id: harbor-smoke
  version: 1
  family: Harbor smoke tasks
  variant: 2 bundled shell tasks, verified by test scripts
  adapter: harbor
  task: bundled:harbor_tasks
  agent: oracle
  grader: task test script (reward 0 or 1)
  task_count: 2
  license: Apache-2.0
  offline: true
  requires: [agent]
  sandbox: docker
  description: Bundled Harbor tasks. Run with model oracle (reference solution) or nop to test the pipeline.

- id: terminal-bench
  version: 2
  family: Terminal-Bench
  variant: Terminal-Bench 2.1 (Harbor registry terminal-bench/terminal-bench-2-1)
  adapter: harbor
  task: terminal-bench/terminal-bench-2-1
  agent: terminus-2
  grader: task test scripts in sandbox
  task_count: 89
  license: Apache-2.0
  requires: [agent, tools]
  sandbox: docker

- id: swe-bench-verified
  version: 1
  family: SWE-bench
  variant: Verified, 500 tasks (Harbor registry swe-bench/swe-bench-verified)
  adapter: harbor
  task: swe-bench/swe-bench-verified
  agent: mini-swe-agent
  grader: repository unit tests in sandbox
  task_count: 500
  license: MIT
  requires: [agent, tools]
  sandbox: docker
  notes: Large Docker images per task; plan disk space accordingly.

- id: aider-polyglot
  version: 1
  family: Aider Polyglot
  variant: 225 Exercism exercises in six languages (Harbor registry aider/aider-polyglot)
  adapter: harbor
  task: aider/aider-polyglot
  agent: terminus-2
  grader: exercise unit tests in sandbox
  task_count: 225
  license: MIT
  requires: [agent, tools]
  sandbox: docker

# tau3-bench (Sierra, 2026) customer-service domains via Harbor's adapter, built on tau2-bench v1.0.1. Each task
# runs a simulated user behind an MCP server; agents connect to it from the task
# container. There is no catalog default agent: pass your own with --agent (see
# examples/tau3_agents), or run `oracle` to check the pipeline for free. The
# simulated user and the grader's natural-language checks call OpenAI models,
# pinned below; changing them makes a new variant.

- id: tau3-retail
  version: 1
  family: tau3-bench
  variant: retail domain, 114 tasks, tau2-bench v1.0.1, simulated user gpt-5-mini, NL assertions graded by gpt-5.2
  adapter: harbor
  task: sierra-research/tau3-bench
  task_filter: ["*tau3-retail-*"]
  env:
    TAU2_USER_MODEL: gpt-5-mini
    TAU2_USER_REASONING_EFFORT: low
    TAU2_NL_ASSERTIONS_MODEL: gpt-5.2
  env_defaults:
    OPENAI_BASE_URL: https://api.openai.com/v1
  patches: &tau2_bench_v1_0_1
    # The task images clone tau2-bench's latest commit; pin the release with the published grading fix.
    - files: "environment/**/Dockerfile"
      old: 'git clone --depth=1 "${TAU2_BENCH_REPO}"'
      new: 'git clone --depth=1 --branch v1.0.1 "${TAU2_BENCH_REPO}"'
  custom_agents: true
  grader: tau2 evaluator (database state and NL assertions), reward 0 or 1
  task_count: 114
  license: MIT
  requires: [agent, tools]
  sandbox: docker
  description: Online retail support. Authenticate the customer, then cancel, modify, return or exchange orders under a written policy.
  notes: Needs OPENAI_API_KEY for the simulated user and grader even when the agent uses another provider. Their spend is reported by the agent as environment cost.

- id: tau3-banking
  version: 1
  family: tau3-bench
  variant: banking_knowledge domain, 97 tasks, tau2-bench v1.0.1, BM25 knowledge search, simulated user gpt-5-mini
  adapter: harbor
  task: sierra-research/tau3-bench
  task_filter: ["*tau3-banking_knowledge-*"]
  env:
    TAU2_USER_MODEL: gpt-5-mini
    TAU2_USER_REASONING_EFFORT: low
    TAU2_NL_ASSERTIONS_MODEL: gpt-5.2
  env_defaults:
    OPENAI_BASE_URL: https://api.openai.com/v1
  patches: *tau2_bench_v1_0_1
  custom_agents: true
  grader: tau2 evaluator (database state, actions and NL assertions), reward 0 or 1
  task_count: 97
  license: MIT
  requires: [agent, tools]
  sandbox: docker
  description: Bank customer service over a 698-document knowledge base. Agents must find procedures, verify identity, and unlock the tools the documents name.
  notes: Needs OPENAI_API_KEY for the simulated user and grader. Strong models score about 20% here.

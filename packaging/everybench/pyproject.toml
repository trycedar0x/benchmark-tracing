# `everybench` on PyPI: installs everyeval under the EveryBench name until the code itself is renamed.
# publish.yml sets this version and the everyeval pins to the release version, so both packages ship together.

[project]
name = "everybench"
version = "0.1.0"
description = "EveryBench by Eva AI: run any benchmark, trace every task, compare runs with paired statistics."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["everyeval==0.1.0"]

[project.optional-dependencies]
benchmarks = ["everyeval[benchmarks]==0.1.0"]
harbor = ["everyeval[harbor]==0.1.0"]
postgres = ["everyeval[postgres]==0.1.0"]
eee = ["everyeval[eee]==0.1.0"]

[project.scripts]
everybench = "everyeval.cli:app"

[project.urls]
Homepage = "https://evabench.dev/everybench"
Source = "https://github.com/trycedar0x/benchmark-tracing"
Issues = "https://github.com/trycedar0x/benchmark-tracing/issues"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
